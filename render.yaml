services:
  # HoldWatch needs TWO long-lived processes on one host: the webhook receiver
  # (PayPal posts to it) and the dashboard (a judge reads it). Render runs one
  # service per process type, so the receiver is its own web service.
  #
  # PLAN NOTES (2026-10-03):
  #  - dashboard: Starter ($7/mo). Upgraded from free so judges never hit a
  #    cold start — the free tier sleeps after 15 min idle and Render's
  #    documented worst-case wake is ~50s. Funded by hackathon credit.
  #  - receiver: deliberately left on free. PayPal retries delivery 25 times
  #    over 3 days, so a sleeping receiver delays an event but never loses one.
  #    Saves $7/mo for no practical cost.
  #
  # These plans are declared here so a Blueprint sync cannot silently revert a
  # manual upgrade back to free.
  - type: web
    name: holdwatch-dashboard
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt || true
    startCommand: python3 app.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Set these in the Render dashboard — never commit them.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: holdwatch-receiver
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt || true
    startCommand: python3 receiver.py --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Without this the receiver cannot verify a signature and now FAILS CLOSED
      # with 503 rather than accepting unverifiable events. Set it or the service
      # will correctly refuse all traffic.
      - key: PAYPAL_WEBHOOK_ID
        sync: false
